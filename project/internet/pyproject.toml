[project]
name = "ids2018"
version = "0.1.0"
description = "CSE-CIC-IDS2018 pcap / dataset 前處理與封包解析"
requires-python = ">=3.12"
dependencies = [
    "scapy==2.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["req_get", "dataset", "rename_to_pcap"]
